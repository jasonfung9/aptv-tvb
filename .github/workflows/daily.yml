name: Daily rebuild
on:
  schedule:
    # 每天 06:00 / 12:00 / 18:00 北京时间 = 22:00 / 04:00 / 10:00 UTC
    - cron: "0 4,10,22 * * *"

  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - run: python3 build_playlist.py
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "Daily rebuild: $(date -u +%Y-%m-%d)"
          git push
